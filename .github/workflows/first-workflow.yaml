name : First Workflow
on: [push]

jobs:
    run-shell-commands:
        runs-on: ubuntu-latest
        steps:
            - name: echo a string
              run: echo "Hello World"
            - name : multiline Command
              run : |
                node -v
                npm -v
    parallel-job-macos:
        runs-on: macos-laatest
        steps:
            - name : View SW Version
              run: sw_vers
